<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?fit=crop&w=1600&q=80') no-repeat center center fixed;
      background-size: cover;
    }

    .form-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 20px 25px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      max-height: 95vh; /* fit screen height */
      overflow-y: auto; /* only if necessary */
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
      color: #555;
      font-size: 13px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 13px;
    }

    textarea {
      resize: none;
    }

    .inline-input {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .inline-input label {
      flex: 1;
      margin-bottom: 0;
      font-size: 13px;
    }

    input[type="submit"] {
      width: 100%;
      background-color: #007BFF;
      color: #fff;
      padding: 8px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    @media (max-width: 450px) {
      .form-container {
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Employee Registration</h1>
    <form action="#" method="post">
      <!-- First Name -->
      <input type="text" id="firstname" name="firstname" placeholder="First Name">

      <!-- Last Name -->
      <input type="text" id="lastname" name="lastname" placeholder="Last Name">

      <!-- Department -->
      <select id="course" name="course">
        <option value="">Select Department</option>
        <option value="BCA">BCA</option>
        <option value="BBA">BBA</option>
        <option value="B.TECH">B.TECH</option>
        <option value="MBA">MBA</option>
        <option value="M.TECH">M.TECH</option>
      </select>

      <!-- Gender -->
      <select id="gender" name="gender">
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <!-- Phone -->
      <div class="inline-input">
        <input type="text" name="countrycode" value="+91" style="width:50px;">
        <input type="text" id="phone" name="phone" placeholder="Phone" style="flex: 1;">
      </div>

      <!-- Address -->
      <textarea id="address" name="address" rows="2" placeholder="Address"></textarea>

      <!-- Email -->
      <input type="email" id="email" name="email" placeholder="Email">

      <!-- Password -->
      <input type="password" id="pass" name="pass" placeholder="Password">

      <input type="password" id="repass" name="repass" placeholder="Retype Password">

      <input type="submit" value="Submit">
    </form>
  </div>
</body>
</html>
